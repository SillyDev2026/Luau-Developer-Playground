name: Validate LuauForge source
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run fetch:wasm
      - run: npm run fetch:libraries
      - run: npm run check
      - run: npm run smoke:wasm
      - run: npm run smoke:libraries
