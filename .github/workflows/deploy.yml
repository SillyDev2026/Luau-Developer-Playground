name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - run: npm run fetch:wasm
      # GitHub Pages may be configured for branch/Jekyll rather than Actions.
      # Keep the exact pinned runtime in main so BOTH publishing modes work.
      # This is idempotent; the follow-up commit triggers one additional build.
      - name: Persist pinned Luau runtime in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/wasm/luau-module.js public/wasm/luau.wasm
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize pinned Luau WASM browser assets"
            git push origin HEAD:main
          fi
      - run: npm run smoke:wasm
      - run: npm run smoke:libraries
      - run: node scripts/verify-dist.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
