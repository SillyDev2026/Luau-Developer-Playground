name: Build and deploy LuauForge 1.7
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run fetch:wasm
      - run: npm run fetch:libraries
      - run: npm run fetch:studio
      - run: npm run fetch:roblox-api
      - run: npm run check
      - run: npm run smoke:wasm
      - run: npm run smoke:libraries
      - run: npm run smoke:v15
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
