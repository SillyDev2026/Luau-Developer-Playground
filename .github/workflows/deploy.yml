name: Build and deploy LuauForge 3.0
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      send_test_announcement:
        description: "Send a Discord test message after deployment"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run fetch:wasm
      - run: npm run fetch:libraries
      - run: npm run fetch:studio
      - run: npm run fetch:roblox-api
      - run: npm run check
      - run: npm run smoke:wasm
      - run: npm run smoke:libraries
      - run: npm run smoke:v15
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Channel announcements are opt-in for the site administrator.
      # Run only after successful GitHub Pages deployment; never expose secret
      # webhooks to browser JavaScript or committed website assets.
      - name: Checkout announcement source
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Announce new release to Discord (optional)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          LUAUFORGE_DISCORD_WEBHOOK_URL: ${{ secrets.LUAUFORGE_DISCORD_WEBHOOK_URL }}
          LUAUFORGE_DISCORD_BOT_TOKEN: ${{ secrets.LUAUFORGE_DISCORD_BOT_TOKEN }}
          LUAUFORGE_DISCORD_TEST_ANNOUNCEMENT: ${{ inputs.send_test_announcement }}
        run: node scripts/announce-discord.mjs
