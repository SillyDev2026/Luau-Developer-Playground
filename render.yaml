services:
  - type: web
    name: luauforge-collab
    runtime: node
    plan: starter
    buildCommand: npm install --ignore-scripts
    startCommand: node server/index.mjs
    healthCheckPath: /health
    disk:
      name: collab-db
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: COLLAB_DATA_FILE
        value: /var/data/workspaces.json
      - key: ALLOWED_ORIGINS
        value: https://sillydev2026.github.io
      - key: FEEDBACK_DATA_FILE
        value: /var/data/feedback.json
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_SUGGESTIONS_FORUM_ID
        value: '1558939401394851850'
      - key: DISCORD_BUG_REPORTS_FORUM_ID
        value: '1558939354234093638'
      - key: NODE_ENV
        value: production
