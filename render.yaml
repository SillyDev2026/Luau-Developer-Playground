services:
  - type: web
    name: luauforge-collab
    runtime: node
    plan: starter
    buildCommand: npm install --ignore-scripts
    startCommand: node server/index.mjs
    healthCheckPath: /health
    disk:
      name: collab-db
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: COLLAB_DATA_FILE
        value: /var/data/workspaces.json
      - key: ALLOWED_ORIGINS
        value: https://sillydev2026.github.io
      - key: NODE_ENV
        value: production
